# CI（pytest / ruff / mypy）— Issue #2254
#
# public repo のためのセキュリティ方針:
# - permissions はデフォルト read-only（contents: read のみ）
# - fork PR への secrets 露出リスクがあるイベントトリガーは使わない
# - secrets を要する job を置かない
# - action は full SHA で pin する
name: ci

on:
  push:
    branches: [main]
  pull_request:

    # Issue #3726: #831 の「変更検出でスコープする」設計原則に追従する。
    # projects/py/<python_package_name> に影響しない変更（docs のみ等）では
    # この workflow をスキップし、無関係な PR の巻き添え FAILURE を防ぐ。
    # モノレポで複数 projects/py/<project> がある場合も、現行 job は単一
    # python_package_name を対象とするため、対象パッケージ配下にスコープする。
    paths:
      - "projects/py/trade_scripts/**"
      - ".github/workflows/ci.yml"


# 同一 workflow・同一 ref への連続 push で先行 run が二重実行されるのを防ぐ

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/py/trade_scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --extra dev
      - name: pytest
        run: uv run pytest
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy src tests
