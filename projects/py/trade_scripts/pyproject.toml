[project]
name = "trade_scripts"
version = "0.1.0"
description = "トレード用スクリプト集"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Issue #2113 と同じ理由で pytest の上限を固定する: pytest-bdd 8.1.0 が
# pytest 10 で削除される内部 API を使用しているため。
dev = [
    "pytest>=9.1.1,<10",
    "pytest-bdd>=8.1.0",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.0",
    "ruff>=0.16.2",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src レイアウトを未インストールでも import 可能にする（tidd run-project-tests は
# project dir で bare pytest を起動するため）
pythonpath = ["src"]
markers = [
    "target_position: position sizing モジュールのテスト",
]
# Issue #4141: 大量ファイルI/Oを伴うテスト（フルビルド系）を繰り返し実行すると
# 一時ディレクトリ（tmp_path）の世代が積み上がり、tmpfs 環境で inode 枯渇を招く。
# 既定（成功・失敗を問わず 3 世代保持）のままだと積み上がるため、失敗時のみ 1 世代に絞る。
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
