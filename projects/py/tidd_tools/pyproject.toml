check-template-drift = "tidd_tools.check_template_drift:register"
verify-post-merge = "tidd_tools.verify_post_merge:register"
weekly-audit = "tidd_tools.weekly_audit:register"
human-queue = "tidd_tools.human_queue:register"
resume-candidates = "tidd_tools.resume_candidates:register"
configure = "tidd_tools.configure:register"
label-pr-slo = "tidd_tools.label_pr_slo:register"
post-test-status = "tidd_tools.post_test_status:register"
context-budget = "tidd_tools.context_budget:register"
context-usage = "tidd_tools.context_usage:register"
memory-triage = "tidd_tools.memory_triage:register"
tick-evidence = "tidd_tools.tick_evidence:register"
lead-time = "tidd_tools.lead_time:register"
transfer-issue-items = "tidd_tools.transfer_issue_test_items:register"
pre-flight = "tidd_tools.pre_flight:register"
ai-review-timing = "tidd_tools.ai_review_timing_report:register"
issue-next-timing = "tidd_tools.issue_next_timing:register"
merge-summary = "tidd_tools.merge_summary:register"
config = "tidd_tools.config:register"
health-check = "tidd_tools.health_check:register"
repo-bootstrap = "tidd_tools.repo_bootstrap:register"
consumer-init = "tidd_tools.consumer_init:register"
cleanup-merged-branch = "tidd_tools.cleanup_merged_branch:register"
docs-sync = "tidd_tools.docs_sync:register"
check-in-progress-label = "tidd_tools.issue_progress_label:register"
tdd-check = "tidd_tools.tdd_check:register"
propose-step = "tidd_tools.propose_step:register"
ensure-agents-skills = "tidd_tools.ensure_agents_skills:register"
sweep-merged-branches = "tidd_tools.sweep_merged_branches:register"
release = "tidd_tools.release:register"
sync-template = "tidd_tools.sync_template:register"
detect-secrets-check = "tidd_tools.detect_secrets_check:register"
sync-pre-commit-rev = "tidd_tools.sync_pre_commit_rev:register"
pre-commit-pytest = "tidd_tools.precommit_pytest:register"

[tool.uv]
package = true


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tidd_tools"]

[tool.pytest.ini_options]
# Issue #2834: 成功したテストの一時ディレクトリを残さず、保持世代も 1 つに絞る。
# 既定（成功・失敗を問わず 3 世代保持）のままだと consumer venv を作るテストの
# 生成物が積み上がってファイルシステムを食い潰す。
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
# Issue #2117: ホワイトリスト外の未知 warning を即座に failure にする。
# 新規 warning が発生した場合は CI が自動的に落ちるため、放置による技術的負債を防ぐ。
# 新しい warning が出た場合は ignore エントリを追加した上で別 Issue で対応方針を検討する。
filterwarnings = [
    "error",
    # pytest-bdd 8.1.0 が pytest 内部 API（_register_fixture / FixtureDef）を使用しているため発生。
    # pytest<10 の上限固定（pyproject.toml dev 依存の上限コメント参照）で回避中。
    # Issue #2113: pytest-bdd が pytest 10 対応完了後に削除予定。
    "ignore::pytest.PytestRemovedIn10Warning",
    # テスト内で起動した subprocess が終了前に GC される場合に発生。
    # テストコード側での制御が困難なため ignore する。
    "ignore::ResourceWarning",
]
