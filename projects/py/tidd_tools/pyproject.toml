[tool.mypy]
strict = true
python_version = "3.11"
# Issue #4201: platform を明示的に固定しないと、mypy はデフォルトで実行ホストの
# sys.platform をターゲットにするため、win32 限定分岐（ctypes.windll 等）の
# `# type: ignore[attr-defined]` の要否が mypy を実行する OS（Linux/WSL か
# Windows 実機ネイティブか）によって変わってしまう（Linux/WSL では必要・
# Windows 実機ネイティブでは unused-ignore エラーになる）。プロジェクトの CI・
# 開発機は Linux/WSL を前提とするため linux に固定し、判定結果をホスト OS に
# 依存させない。
platform = "linux"
# Issue #3698: native parser を有効化し PEP 758（except A, B:・Python 3.14）を受理する。
# mypy の default parser は実行中 Python の文法に追従するため、Python < 3.14 runtime では
# `--python-version 3.14` でも PEP 758 を [syntax] として拒否する。ruff 0.16 の py314
# target が生成する PEP 758 形式と整合させるため native parser を明示する
# （mypy 2.1+ で利用可・将来デフォルト化予定）。
native_parser = true
# Issue #3727: pre-flight の mypy は `mypy src tests`（CI の consumer `uv run mypy src tests` と
# 同一）で tests/ も検査する。本家（tidd_tools 自身）は CI（.circleci）が `mypy src/` のみを
# 検査し tests/ の型注釈債務が未解消（2057 件超）のため、ここで tests/ 配下の型エラーを
# 抑制して pre-flight を GREEN に保つ。consumer は copier 雛形の pyproject.toml（本
# overrides 無し）で配布されるため tests/ も strict 検査され、型注釈欠落が CI 前に検知される。
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# platformdirs は型スタブを提供していない（PEP 561 未対応）。
# 実行時に import 可能であれば十分なため、mypy 上は型情報欠如を無視する。
[[tool.mypy.overrides]]
module = "platformdirs"
ignore_missing_imports = true

# PyYAML: types-PyYAML スタブが別パッケージ。dev 依存に追加せずに
# mypy の [import-untyped] エラーを抑制する。
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

# numpy: 新バージョンの型スタブが PEP 695 type 文（Python 3.12+）を使用するため、
# python_version = "3.11" 環境では syntax error になる（Issue #1859）。
# numpy は tidd_tools の実行依存ではなく embedding_prefilter の optional 依存経由で
# 間接的に参照される。ignore_missing_imports は「未インストール時」のみ有効で、
# CI（uv sync --all-extras）のように numpy インストール済みの環境では同梱スタブを
# follow して syntax error になるため、follow_imports = "skip" で解析自体を止める。
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

# model2vec / sentence_transformers: optional 依存のため型スタブが存在しない。
# インストール有無で import-not-found / import-untyped のどちらが発生するか異なるため
# ignore_missing_imports で統一的に抑制し、インストール済み環境（CI --all-extras）で
# パッケージ本体を follow しないよう follow_imports = "skip" を併用する（Issue #1859）。
[[tool.mypy.overrides]]
module = ["model2vec", "model2vec.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C901"]
ignore = ["E402"]

# Issue #3080: 循環的複雑度チェック（mccabe C901）。閾値 15・既存違反は noqa baseline
# 方式で免除し、新規コードのみ即エラー化する（drain は #3079）。
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# テストは日本語 docstring や長い fixture データが含まれやすく E501 を厳格に
# 適用すると保守コストが高い。src/ は line-length=120 で厳格に運用する。
# N802: step_defs は pytest-bdd の Scenario 名を日本語で test 関数名に使うため小文字制約を除外する。
"tests/**/*.py" = ["E501", "N802"]
# ai-review プロンプト本文は旧 ai-review.sh の cat <<PROMPT を 1:1 で踏襲するため、
# 日本語文字列リテラルが長くなる。改行を入れるとプロンプトの意味が変わるリスクが
# 高いため、プロンプト定義モジュールに限定して E501 を除外する。
"src/tidd_tools/ai_review/prompts.py" = ["E501"]

# Formatter (ruff format) 設定。ADR: docs/decisions/012-ruff-format-adopted.md
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false

# Issue #1286: mutmut mutation testing 設定
# mutmut 3.x は pyproject.toml の [tool.mutmut] を自動読み込みする。
# CircleCI で `uv run mutmut run` を呼ぶだけで下記対象モジュールに mutation が適用される。
# 初期 6 か月は observation のみ（KPI 化は #1300 で対応）。
[tool.mutmut]
# mutmut 3.x で `paths_to_mutate` → `source_paths`、`tests_dir` (str) →
# `pytest_add_cli_args_test_selection` (list) にリネームされた（Issue #1374）。
#
# source_paths にパッケージ全体を渡すことで mutants/ ディレクトリに shared/ 等の
# 依存モジュールもコピーされ、テストの `from tidd_tools.shared import ...` が通る。
# mutation 対象は `only_mutate` の glob で critical モジュール（ai_review・
# test_plan・issue_quality_check）に限定する（fnmatch なので `*` は `/` にもマッチする）。
#
# Issue #1439: pytest_add_cli_args_test_selection を critical モジュール直下の test に絞る。
# 過去 Issue #1379 の `["tests"]` 全走行設定は「parents[N] エラー混入を見逃さないため」
# だったが、以下により当該妥協理由は消滅した:
#   - PR #1424・#1433 で残存 parents[N] を掃討
#   - `.claude/hooks/ban-parents-n.py` で新規追加を PreToolUse hook で機械強制ブロック
#   - `.circleci/detect_baseline_silent_fail.py`（PR #1437）で万一の baseline abort を明示化
#
# 全走行に戻すと、E2E / sandbox_copier 等の critical モジュールと無関係な test の失敗で
# baseline check が abort し mutation testing loop に到達できない構造的問題が再発する
# （Issue #1419 → PR #1424 → 再発 → PR #1433 → 再発 の 3 回連続露呈）。
# critical モジュールの mutation 検出という mutmut 本来の目的に手段を一致させる。
source_paths = ["src/tidd_tools/"]
only_mutate = [
    "src/tidd_tools/ai_review/*",
    "src/tidd_tools/test_plan.py",
    "src/tidd_tools/issue_quality_check.py",
]
# pytest の positional (`tests/`) で collection、`-k` filter で critical モジュール直下の
# test に絞る。keyword は test node ID（path + test name）に対する部分一致で評価される:
#   - "ai_review": tests/test_ai_review_*.py にマッチ
#   - "test_plan": tests/test_test_plan.py にマッチ
#   - "issue_quality_check": tests/test_issue_quality_check*.py にマッチ
#   - "regressions": tests/regressions/ 配下（path に含まれる）にマッチ
# これで tests/ 直下の E2E / sandbox_copier / gh cache 等の無関係 test は baseline
# check から除外されるが、"regressions" は tests/regressions/ 配下を丸ごとマッチ
# させるため、同ディレクトリ内の実 copier copy / uv sync / mypy 起動を伴う
# pytest.mark.slow E2E テスト（Issue #2969）は依然として含まれる。この残存分は
# 下記 `-m "not slow"`（Issue #2983）で除外する。
pytest_add_cli_args_test_selection = [
    "tests/",
    "-k",
    "ai_review or test_plan or issue_quality_check or regressions",
    "-m",
    "not slow",
]
# Issue #2939: mutmut は mutant を estimated_worst_case_time（その mutant を
# カバーする test の実行時間合計）昇順にソートして実行するため
# （mutmut/__main__.py `mutants = sorted(mutants, key=lambda x:
# estimated_worst_case_time(x[1]))`）、実行コストの高い mutant は必ず run の
# 末尾に集まる。1 mutant あたりの wall time 上限は
# `(estimated_time_of_tests + timeout_constant) * timeout_multiplier` で決まり、
# ライブラリ既定値 timeout_multiplier=15.0 はカバー test 数の多い critical
# モジュール（ai_review 等）の mutant に対し 1 mutant あたり 10 分を超える
# タイムアウト猶予を与えてしまう。resource_class を medium(4GB)→large(8GB) に
# 倍増した #2920 の修正後も pipeline #108（Issue #2939）で 14519/14535
# （99.9%）まで進行した状態で全く同じ "Received "killed" signal" が再発し、
# resource_class を増やすだけでは解決しないことが判明した（末尾に集中する
# 低速 mutant 群が --max-children 2 で並行実行される間に蓄積するメモリ・
# 実行時間がコンテナのメモリ上限を超えていると推定される）。
# timeout_multiplier を引き下げて 1 mutant あたりの wall time 上限を数分
# オーダーに抑え、末尾の低速 mutant 群を早期に timeout させることで job
# 全体が完走前に OOM kill される事態を防ぐ。
timeout_multiplier = 5.0
# Issue #2983: timeout_multiplier=5.0 化（#2939）後も pipeline #109 で
# 全く同じ 14519/14535（99.9%）付近で "Received "killed" signal" が
# 再発した。mutmut/__main__.py を追跡すると、pytest_add_cli_args_test_selection
# は stats 収集フェーズ（`run_stats_collection` → `runner.run_stats(tests=[])`）
# でのみ使われ、そこで見つかった test だけが以後の mutation loop で各 mutant の
# 「カバーする test」として再実行される仕様と判明した。従来の `-k` 条件は
# tests/regressions/ 配下の pytest.mark.slow（Issue #2969: 実 copier copy /
# uv sync / mypy 起動を伴う E2E テスト）にもマッチしていた。mutant 実行が
# register_timeout() の wall time 超過で SIGXCPU を送られ強制終了される際、
# その mutant テスト worker が slow テスト内部でブロッキング subprocess
# （uv sync / copier copy / mypy）呼び出し中だと、Unix の仕様上 forked
# worker を kill してもその子プロセスは自動終了せず孤児化してバックグラウンド
# で動き続ける。mutant 実行が進むほどこれが蓄積し、estimated_worst_case_time
# 昇順ソートで低速 test に紐づく mutant が集まる run 末尾で OOM kill を
# 招くと推定される（resource_class 倍増・timeout_multiplier 引き下げの
# いずれも孤児プロセス蓄積そのものは解消しないため、両修正後も同一箇所で
# 再発したことと整合する）。上記 pytest_add_cli_args_test_selection に
# `-m "not slow"` を追加し、これら重い E2E テストを stats 収集対象から
# 除外することで孤児プロセス蓄積の発生源を断つ。

[tool.coverage.run]
source = ["src/tidd_tools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Issue #1287: coverage 段階引き上げ計画（#2587 で 65 に中間引き上げ）
#   - 2026-07 スタート: fail_under = 55（当時実測 60% の直下・regression 検知用マージン）
#   - 2026-07 中間引き上げ (#2587): fail_under = 65（実測 70.7% の約 5pt 下）
#   - 半年後 (2027-01): fail_under = 70
#   - 1 年後 (2027-07): fail_under = 85
# CircleCI の pytest 実行で --cov --cov-report=xml を付与し、
# 閾値未達で job を fail させる。coverage.xml は analyze-performance が集計する。
fail_under = 65
