[project]
name = "tidd_tools"
version = "0.1.0"
description = "TiDD ワークフローの開発インフラ CLI（test-plan / ai-review / hooks 等の Python 実装）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",  # Issue #3116: custom backend（OpenAI 互換 API）の HTTP client
    "platformdirs>=4",
    "PyJWT[crypto]>=2.8",
    "pyyaml>=6.0",
    # Issue #3693: pre-flight の hooks lint（ruff/mypy）を実行中環境の python -m で
    # 解決するため runtime deps に含める（consumer の uvx 環境でも検査可能にする）。
    # Issue #2478 の厳密ピンは、#2562 で uv.lock を git 管理化し lock ファイルが
    # 版ドリフトを解決するようになったため役目を終え、下限指定に戻す。
    # Issue #3698: mypy 2.1+ の native parser（--native-parser）が PEP 758
    # （except A, B:・Python 3.14）を runtime Python 非依存で受理する。ruff 0.16 の
    # py314 target が生成する PEP 758 形式を hooks-lint が許容できるよう下限を 2.1 に上げる。
    "mypy>=2.1",
    "ruff>=0.16.0",
    # Issue #4025: detect-secrets-check サブコマンドが .secrets.baseline 照合に使う。
    # .pre-commit-config.yaml の detect-secrets hook（rev v1.5.0）とバージョンを揃える。
    "detect-secrets>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",  # Issue #2113: pytest-bdd 8.1.0 が pytest 10 で削除される内部 API を使用しているため上限固定
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "pytest-bdd>=7.0",
    "pytest-xdist>=3.0",  # Issue #2191: pytest 並列化（-n auto）で pre-flight/ai-review を高速化
    "mutmut>=3.0",
    "syrupy>=5.5.3",
    "vulture>=2.11",  # Issue #3058: 未使用関数・変数の機械検出（pre-flight ratchet）
]
# Issue #1626: ローカル埋め込み pre-filter 用オプション依存
# `uv add model2vec` または `uv add tidd-tools[embeddings]` でインストール
embeddings = [
    "model2vec>=0.5",
]

[project.scripts]
tidd = "tidd_tools.__main__:main"

[project.entry-points."tidd_tools.commands"]
test-plan = "tidd_tools.test_plan:register"
classify-test-failure = "tidd_tools.classify_test_failure:register"
check-no-shell-files = "tidd_tools.check_no_shell_files:register"
issue-next-state = "tidd_tools.issue_next_state:register"
loop-error-log = "tidd_tools.loop_error_log:register"
check-pr-conflicts = "tidd_tools.check_pr_conflicts:register"
analyze-performance = "tidd_tools.analyze_performance:register"
analyze-loop-errors = "tidd_tools.analyze_loop_errors:register"
watch-circleci-failures = "tidd_tools.watch_circleci_failures:register"
wait-ci = "tidd_tools.wait_ci:register"
worktree-add = "tidd_tools.worktree_add:register"
ai-review = "tidd_tools.ai_review.cli:register"
collect-env-snapshot = "tidd_tools.collect_env_snapshot:register"
report-test-status = "tidd_tools.report_test_status:register"
run-project-tests = "tidd_tools.run_project_tests:register"
screenshot-attach = "tidd_tools.screenshot_attach:register"
lint-hardcoded-repo = "tidd_tools.lint_hardcoded_repo:register"
win-compat-scan = "tidd_tools.win_compat_scan:register"
